name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-host -DEQVITA_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-host --parallel

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

      - name: Build script guard tests
        shell: pwsh
        run: ./scripts/test-build-wsl-validation.ps1

      - name: WSL shell build script guard tests
        run: bash scripts/test-wsl-shell-validation.sh

  security-checks:
    name: Strict host sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with ASan and UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DEQVITA_HOST_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure

  armv7-qemu:
    name: ARMv7 Cortex-A9 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user

      - name: Run ARMv7 tests
        run: bash scripts/test-armv7-qemu.sh

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release inputs
        shell: pwsh
        run: ./scripts/check-release-hygiene.ps1

  vita-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Vita artifacts
        run: |
          docker run --rm \
            -v "$PWD:/build/git" \
            -w /build/git \
            vitasdk/vitasdk@sha256:2d7203c960a3f76a1fcec72d8dcfb97ddbbde8086b56458291f54e2ec17fb0f3 \
            bash -lc 'arm-vita-eabi-gcc --version && cmake --version && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel'

      - name: Create artifact checksums
        run: |
          test -f build/app/EQVita.vpk
          test -f build/plugin/eq_speaker.skprx
          sha256sum build/app/EQVita.vpk build/plugin/eq_speaker.skprx | sudo tee build/EQVita.sha256 > /dev/null

      - name: Upload Vita artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqvita-vita-artifacts
          path: |
            build/app/EQVita.vpk
            build/plugin/eq_speaker.skprx
            build/EQVita.sha256
          if-no-files-found: error
